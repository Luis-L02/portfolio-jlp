name: CI Verification

on:
  pull_request:
    branches:
      - develop

jobs:
  validate:
    name: Build & Test
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular application
        run: npm run build

      - name: Run unit tests
        run: npm test -- --watch=false
